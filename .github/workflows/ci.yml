name: Weave correctness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [73129, 982451653]
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: weave
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U weave -d weave"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/weave
      REDIS_PORT: 6379
      DATABASE_USER: weave
      DATABASE_PASSWORD: weave-test
      WEAVE_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/weave?currentSchema=weave_phase2_test
      WEAVE_TOKEN_SECRET: ephemeral-ci-signing-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Java convergence, real TCP chaos, adversarial clocks, causal GC and PostgreSQL integration
        run: mvn -B -ntp -f server/pom.xml verify -Dweave.seed=${{ matrix.seed }}
      - run: npm ci
        working-directory: client
      - run: npm test && npm run test:parity && npm run build
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Start app for browser regression checks
        shell: bash
        run: |
          java -jar server/target/weave-server-0.2.0.jar > server/target/app.log 2>&1 &
          npm run dev --prefix client > server/target/vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' -d '{"name":"CI readiness"}' http://127.0.0.1:5187/api/v1/boards; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm run test:e2e && npm run test:phase5 && npm run test:phase6
        working-directory: client
      - name: Measured local load smoke (not a latency threshold)
        if: matrix.seed == 73129
        run: npm run test:load
        working-directory: client
        env:
          WEAVE_LOAD_CLIENTS: 5,10
          WEAVE_LOAD_ROUNDS: 1
          WEAVE_LOAD_TICKS: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.seed }}
          path: |
            server/target/surefire-reports/
            server/target/convergence-failure.json
            server/target/convergence-cases.json
            server/target/compaction-result.json
            server/target/gc-result.json
            client/test-results/
            server/target/*.log

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create ephemeral Compose credentials
        shell: bash
        run: |
          umask 077
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 32)" > .env
          echo "WEAVE_TOKEN_SECRET=$(openssl rand -hex 48)" >> .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e && npm run test:phase5 && npm run test:phase6
        working-directory: client
        env:
          WEAVE_PREVIEW_URL: http://127.0.0.1:5188
      - name: Capture container logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-acceptance
          path: |
            compose.log
            client/test-results/
      - run: docker compose down
        if: always()
