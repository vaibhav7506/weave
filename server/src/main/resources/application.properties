spring.application.name=weave
server.address=${WEAVE_BIND:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:127.0.0.1}:${DATABASE_PORT:55432}/${DATABASE_NAME:weave}${DATABASE_OPTIONS:}}
spring.datasource.username=${DATABASE_USER:weave}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
weave.token-secret=${WEAVE_TOKEN_SECRET}
weave.allowed-origins=${WEAVE_ORIGINS:${RENDER_EXTERNAL_URL:http://127.0.0.1:5187,http://localhost:5187}}
server.error.include-message=never

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:56379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s
weave.redis.enabled=${WEAVE_REDIS_ENABLED:true}
weave.redis.channel=${WEAVE_REDIS_CHANNEL:weave:boards:v1}
weave.compaction.threshold=${WEAVE_COMPACTION_THRESHOLD:1000}
weave.compaction.interval-ms=${WEAVE_COMPACTION_INTERVAL_MS:60000}
weave.sync.sweep-ms=${WEAVE_SYNC_SWEEP_MS:2000}
weave.operations-per-second=${WEAVE_OPERATIONS_PER_SECOND:100}
weave.operation-burst=${WEAVE_OPERATION_BURST:200}
weave.token-lifetime-seconds=${WEAVE_TOKEN_LIFETIME_SECONDS:604800}
weave.clock-tolerance-ms=${WEAVE_CLOCK_TOLERANCE_MS:30000}

weave.replica-lease-seconds=${WEAVE_REPLICA_LEASE_SECONDS:300}
weave.websocket.virtual-threads=${WEAVE_VIRTUAL_THREADS:true}
