# Free demo deployment. Render Free Postgres expires after 30 days.
# Import into an account with available free resources; inspect its plan before creating.
services:
  - type: web
    name: weave-whiteboard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/docker/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: 'off'
    envVars:
      - key: WEAVE_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: weave-history
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: weave-history
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: weave-history
          property: password
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: weave-relay
          property: connectionString
  - type: keyvalue
    name: weave-relay
    plan: free
    region: singapore
    ipAllowList: []
databases:
  - name: weave-history
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    databaseName: weave
    user: weave
    ipAllowList: []
