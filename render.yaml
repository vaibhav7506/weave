# Deploys the web service. Attach an existing PostgreSQL database and Key Value
# instance through the Render dashboard when the account has no free slots left.
services:
  - type: web
    name: weave-whiteboard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./infra/docker/Dockerfile
    healthCheckPath: /api/v1/health
    autoDeployTrigger: 'off'
    envVars:
      - key: WEAVE_TOKEN_SECRET
        generateValue: true
